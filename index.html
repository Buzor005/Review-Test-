<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Test / แบบทดสอบการตรวจทาน</title>
<style>
  :root{
    --paper:#FBFCFD; --ink:#14181F; --muted:#5A6472; --line:#E4E8EE;
    --teal:#0E7C86; --teal-050:#E6F3F4; --amber:#9A5B0B; --amber-050:#FBF1E3;
    --rose:#B42318; --shadow:0 1px 2px rgba(20,24,31,.04),0 8px 24px rgba(20,24,31,.06);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Leelawadee UI","Sarabun",Tahoma,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Leelawadee UI",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.6}
  .wrap{max-width:640px;margin:0 auto;padding:24px 18px 96px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:0 0 6px}
  h1{font-size:26px;line-height:1.2;letter-spacing:-.01em;margin:0 0 12px;font-weight:650}
  h2{font-size:15px;margin:0 0 8px;font-weight:640}
  p{margin:0 0 14px}
  .lede{color:var(--muted);font-size:15px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;
    box-shadow:var(--shadow);margin:0 0 16px}
  label.field{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
  input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;background:#fff}
  textarea{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;background:#fff;min-height:66px;resize:vertical;margin-top:8px}
  input:focus,textarea:focus,button:focus-visible,.opt:focus-within{outline:2px solid var(--teal);outline-offset:1px}
  button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:13px 20px;font-weight:640}
  .btn-primary{background:var(--teal);color:#fff;width:100%}
  .btn-primary:disabled{background:#C3CBD4;cursor:not-allowed}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn-row button{flex:1;min-width:140px}

  .langbar{display:flex;gap:8px;justify-content:flex-end;margin:0 0 14px}
  .langbar button{padding:7px 14px;border-radius:99px;font-size:13px;border:1px solid var(--line);
    background:#fff;color:var(--muted);font-weight:600}
  .langbar button[data-on="1"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  .prog{display:flex;align-items:center;gap:12px;margin:0 0 20px}
  .prog .bar{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
  .prog .bar>i{display:block;height:100%;background:var(--teal);width:0;transition:width .35s ease}
  .prog .count{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}

  .spec{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .spec .head{background:#F3F5F8;padding:8px 12px;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  .spec .row{display:flex;justify-content:space-between;gap:14px;padding:7px 12px;border-bottom:1px solid var(--line)}
  .spec .row:last-child{border-bottom:0}
  .spec .k{color:var(--muted)}
  .spec .v{text-align:right;font-weight:600}
  .summary{font-size:15.5px;line-height:1.7}

  .tag{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--teal-050);
    color:var(--teal);border-radius:6px;padding:1px 6px;margin-left:2px}
  .claims{font-family:var(--mono);font-size:12.5px;border:1px dashed #CBD9DA;border-radius:10px;
    background:#F7FBFB;padding:4px 12px;margin-top:4px}
  .claims .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #E6EDED}
  .claims .row:last-child{border-bottom:0}
  .claims .k{color:var(--teal)}
  .checklist{margin-top:4px}
  .chk{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);
    border-radius:9px;margin-bottom:7px;font-size:14px;background:#fff;cursor:pointer}
  .chk input{width:18px;height:18px;accent-color:var(--amber);margin:0}
  .scaffold-note{font-size:12.5px;color:var(--amber);background:var(--amber-050);
    border-radius:8px;padding:8px 11px;margin:0 0 12px}

  .q{margin-top:6px}
  .q .qlabel{font-size:14px;font-weight:600;margin:0 0 8px}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{flex:1;min-width:140px;position:relative;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-size:14px;cursor:pointer;background:#fff;display:flex;align-items:center;gap:9px}
  .opt input{position:absolute;opacity:0}
  .opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid #C3CBD4;flex:none}
  .opt[data-on="1"]{border-color:var(--teal);background:var(--teal-050)}
  .opt[data-on="1"] .dot{border-color:var(--teal);background:var(--teal)}
  .divider{height:1px;background:var(--line);margin:18px 0}
  .foot{color:var(--muted);font-size:12.5px}
  .hidden{display:none}
  .stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .stat:last-child{border-bottom:0}
  .stat b{font-family:var(--mono)}
  .pill{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:#F3F5F8;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------------- state ---------------- */
const app=document.getElementById("app");
let LANG="th";
let S={pid:"",order:[],cond:{},idx:0,started:0,resp:{}};
const tr=()=>T[LANG];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------------- intro ---------------- */
function screenIntro(){
  const t=tr();
  app.innerHTML=`
    <div class="langbar">
      <button data-lang="th" data-on="${LANG==="th"?1:0}">ไทย</button>
      <button data-lang="en" data-on="${LANG==="en"?1:0}">English</button>
    </div>
    <p class="eyebrow">${t.eyebrow}</p>
    <h1>${t.h1}</h1>
    <p class="lede">${t.lede}</p>
    <div class="card">
      <label class="field" for="pid">${t.nameLabel}</label>
      <input type="text" id="pid" placeholder="${t.namePh}" autocomplete="off">
      <p class="foot" style="margin:10px 0 0">${t.nameFoot}</p>
    </div>
    <button class="btn-primary" id="go" disabled>${t.start}</button>`;
  document.querySelectorAll('.langbar button').forEach(b=>b.addEventListener("click",()=>{
    LANG=b.dataset.lang; document.documentElement.lang=LANG; screenIntro();}));
  const pid=document.getElementById("pid"), go=document.getElementById("go");
  pid.addEventListener("input",()=>{go.disabled=!pid.value.trim();});
  pid.addEventListener("keydown",e=>{if(e.key==="Enter"&&pid.value.trim())go.click();});
  go.addEventListener("click",()=>{
    S.pid=pid.value.trim();
    S.order=shuffle(ITEMS.map(i=>i.id));
    const conds=shuffle([...Array(6).fill("structured"),...Array(6).fill("plain")]);
    S.order.forEach((id,k)=>S.cond[id]=conds[k]);
    S.idx=0; renderItem();
  });
  pid.focus();
}

/* ---------------- item ---------------- */
function renderItem(){
  const t=tr(), id=S.order[S.idx], item=ITEMS.find(i=>i.id===id), c=item[LANG], cond=S.cond[id];
  const n=S.idx+1, pct=Math.round((S.idx)/12*100);
  const specRows=c.spec.map(([k,v])=>`<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("");

  let structured="";
  if(cond==="structured"){
    const claimRows=c.claims.map(([k,v])=>`<div class="row"><span class="k">${esc(k)}</span><span>${esc(v)}</span></div>`).join("");
    const checks=t.req.map(([key,lbl])=>`<label class="chk"><input type="checkbox" data-chk="${key}"> ${esc(lbl)}</label>`).join("");
    structured=`
      <p class="scaffold-note">${t.scaffold}</p>
      <div class="card"><h2>${t.claimsHead} <span class="tag">${t.claimsTag}</span></h2><div class="claims">${claimRows}</div></div>
      <div class="card"><h2>${t.checkHead}</h2><div class="checklist">${checks}</div></div>`;
  }

  app.innerHTML=`
    <div class="prog"><span class="count">${t.listing} ${n} ${t.of} 12</span><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="card"><div class="spec"><div class="head">${t.specHead}</div>${specRows}</div></div>
    <div class="card"><h2>${t.summary}</h2><p class="summary" style="margin:0">${esc(c.summary)}</p></div>
    ${structured}
    <div class="card">
      <div class="q">
        <p class="qlabel">${t.q1}</p>
        <div class="opts" data-group="wrong">
          <label class="opt" data-val="no"><input type="radio" name="wrong"><span class="dot"></span>${t.q1no}</label>
          <label class="opt" data-val="yes"><input type="radio" name="wrong"><span class="dot"></span>${t.q1yes}</label>
        </div>
        <textarea class="hidden" id="wrongText" placeholder="${t.q1ph}"></textarea>
      </div>
      <div class="divider"></div>
      <div class="q">
        <p class="qlabel">${t.q2}</p>
        <div class="opts" data-group="missing">
          <label class="opt" data-val="no"><input type="radio" name="missing"><span class="dot"></span>${t.q2no}</label>
          <label class="opt" data-val="yes"><input type="radio" name="missing"><span class="dot"></span>${t.q2yes}</label>
        </div>
        <textarea class="hidden" id="missingText" placeholder="${t.q2ph}"></textarea>
      </div>
    </div>
    <button class="btn-primary" id="next" disabled>${S.idx===11?t.finish:t.next}</button>`;

  let wrong=null, missing=null;
  const wt=document.getElementById("wrongText"), mt=document.getElementById("missingText");
  function paint(g,val){document.querySelectorAll(`.opts[data-group="${g}"] .opt`).forEach(o=>o.dataset.on=(o.dataset.val===val)?"1":"0");}
  function refresh(){document.getElementById("next").disabled=!(wrong&&missing);}
  document.querySelectorAll('.opts[data-group="wrong"] .opt').forEach(o=>o.addEventListener("click",()=>{
    wrong=o.dataset.val;paint("wrong",wrong);wt.classList.toggle("hidden",wrong!=="yes");refresh();}));
  document.querySelectorAll('.opts[data-group="missing"] .opt').forEach(o=>o.addEventListener("click",()=>{
    missing=o.dataset.val;paint("missing",missing);mt.classList.toggle("hidden",missing!=="yes");refresh();}));

  S.started=Date.now();
  document.getElementById("next").addEventListener("click",()=>{
    const checks={};document.querySelectorAll('input[data-chk]').forEach(x=>checks[x.dataset.chk]=x.checked);
    S.resp[id]={condition:cond,lang:LANG,wrong,missing,wrongText:wt.value.trim(),missingText:mt.value.trim(),checks,ms:Date.now()-S.started};
    if(S.idx===11){renderDone();}else{S.idx++;window.scrollTo(0,0);renderItem();}
  });
  window.scrollTo(0,0);
}

/* ---------------- done ---------------- */
function renderDone(){
  const t=tr();
  app.innerHTML=`
    <p class="eyebrow">${t.doneEye}</p>
    <h1>${t.doneH1}</h1>
    <p class="lede">${t.doneLede}</p>
    <div class="card">
      <h2>${t.sendHead}</h2>
      <p class="foot" style="margin-top:0">${t.sendFoot}</p>
      <div class="btn-row">
        <button class="btn-primary" id="dl">${t.dl}</button>
        <button class="btn-ghost" id="cp">${t.cp}</button>
      </div>
    </div>
    <button class="btn-ghost" id="showRes" style="width:100%">${t.showRes}</button>
    <div id="res"></div>`;
  document.getElementById("dl").addEventListener("click",downloadData);
  document.getElementById("cp").addEventListener("click",()=>{
    navigator.clipboard.writeText(JSON.stringify(payload(),null,2)).then(()=>{document.getElementById("cp").textContent=t.copied;});});
  document.getElementById("showRes").addEventListener("click",renderResults);
}
function payload(){return {participant:S.pid,language:LANG,completedAt:new Date().toISOString(),order:S.order,responses:S.order.map(id=>({item:id,...S.resp[id]}))};}
function downloadData(){
  const blob=new Blob([JSON.stringify(payload(),null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`review-test_${S.pid.replace(/\s+/g,"-")||"anon"}.json`;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}

/* ---------------- researcher scoring ---------------- */
function renderResults(){
  const t=tr();
  const B={plain:blank(),structured:blank()};
  function blank(){return {commHit:0,commTot:0,omHit:0,omTot:0,omHiHit:0,omHiTot:0,inHit:0,inTot:0,outHit:0,outTot:0,cleanOk:0,cleanTot:0,falseWrong:0,falseMiss:0,times:[]};}
  S.order.forEach(id=>{
    const it=ITEMS.find(i=>i.id===id),r=S.resp[id],b=B[r.condition];b.times.push(r.ms);
    const fw=r.wrong==="yes",fm=r.missing==="yes";
    if(it.key.type==="commission"){b.commTot++;if(fw)b.commHit++;if(fm)b.falseMiss++;}
    else if(it.key.type==="omission"){b.omTot++;if(fm)b.omHit++;
      if(it.key.severity==="high"){b.omHiTot++;if(fm)b.omHiHit++;}
      if(it.key.schema==="in"){b.inTot++;if(fm)b.inHit++;}
      if(it.key.schema==="out"){b.outTot++;if(fm)b.outHit++;}
      if(fw)b.falseWrong++;}
    else{b.cleanTot++;if(!fw&&!fm)b.cleanOk++;if(fw)b.falseWrong++;if(fm)b.falseMiss++;}
  });
  const med=a=>{if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);};
  const rate=(h,tt)=>tt?Math.round(h/tt*100)+"%":"—";
  function block(name,b){return `<div class="card"><h2>${name} <span class="pill">${b.times.length} ${t.rItems}</span></h2>
    <div class="stat"><span>${t.rComm}</span><b>${rate(b.commHit,b.commTot)} <span class="pill">${b.commHit}/${b.commTot}</span></b></div>
    <div class="stat"><span>${t.rOm}</span><b>${rate(b.omHit,b.omTot)} <span class="pill">${b.omHit}/${b.omTot}</span></b></div>
    <div class="stat"><span>${t.rHi}</span><b>${rate(b.omHiHit,b.omHiTot)} <span class="pill">${b.omHiHit}/${b.omHiTot}</span></b></div>
    <div class="stat"><span>${t.rIn}</span><b>${rate(b.inHit,b.inTot)} <span class="pill">${b.inHit}/${b.inTot}</span></b></div>
    <div class="stat"><span>${t.rOut}</span><b>${rate(b.outHit,b.outTot)} <span class="pill">${b.outHit}/${b.outTot}</span></b></div>
    <div class="stat"><span>${t.rClean}</span><b>${rate(b.cleanOk,b.cleanTot)} <span class="pill">${b.cleanOk}/${b.cleanTot}</span></b></div>
    <div class="stat"><span>${t.rFalse}</span><b>${b.falseWrong+b.falseMiss}</b></div>
    <div class="stat"><span>${t.rTime}</span><b>${(med(b.times)/1000).toFixed(1)}s</b></div></div>`;}
  document.getElementById("res").innerHTML=`
    <div class="divider"></div>
    <p class="eyebrow">${t.resTitle} · ${esc(S.pid)}</p>
    <p class="foot">${t.resNote}</p>
    ${block(t.cStructured,B.structured)}
    ${block(t.cPlain,B.plain)}
    <p class="foot">${t.resFoot}</p>`;
  document.getElementById("res").scrollIntoView({behavior:"smooth"});
}

screenIntro();
</script>
</body>
</html>
